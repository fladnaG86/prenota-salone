# nginx — wildcard subdomains -> Prenota Salone (one tenant per subdomain)
#
#   <slug>.example.com  ->  127.0.0.1:8899
#
# Model: ONE server block with a wildcard server_name. The app resolves the
# tenant from the Host header, so no per-salon block is needed.
# TLS: use a wildcard certificate (certbot -d domain -d "*.domain"), or put
# Cloudflare Free in front and keep this block plain HTTP:80.

server {
    listen 80;
    listen [::]:80;
    server_name example.com *.example.com;

    # Preserve the tenant: without this the app always sees "127.0.0.1".
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
